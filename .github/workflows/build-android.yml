name: Build Simple Live Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Set China mirror
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      - name: Upgrade Gradle wrapper to 8.14.0
        working-directory: simple_live_app/android
        run: |
          sed -i 's|gradle-8.12.0-|gradle-8.14.0-|g' gradle/wrapper/gradle-wrapper.properties
          sed -i 's|gradle-8.12-|gradle-8.14-|g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade AGP and Kotlin
        working-directory: simple_live_app/android
        run: |
          FILES=$(find . -maxdepth 2 \( -name "settings.gradle*" -o -name "build.gradle*" \) -type f)
          for f in $FILES; do
            echo "==== $f ===="
            sed -i 's/8\.9\.1/8.11.1/g' "$f"
            sed -i 's/2\.1\.0/2.2.20/g' "$f"
            cat "$f"
          done

      - name: Flutter clean
        working-directory: simple_live_app
        run: flutter clean

      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build release APK
        working-directory: simple_live_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

name: Build Simple Live Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Set China mirror
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      - name: Upgrade Gradle wrapper to 8.14
        working-directory: simple_live_app/android
        run: |
          sed -i 's|gradle-8\.12[.-]|gradle-8.14-|g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Upgrade AGP 8.11.1 and Kotlin 2.2.20
        working-directory: simple_live_app/android
        run: |
          for f in settings.gradle settings.gradle.kts build.gradle build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i 's/8\.9\.1/8.11.1/g' "$f"
              sed -i 's/2\.1\.0/2.2.20/g' "$f"
              echo "==== $f ===="
              cat "$f"
            fi
          done

      - name: Fix null cast in app/build.gradle.kts
        working-directory: simple_live_app/android/app
        run: |
          if [ -f build.gradle.kts ]; then
            cp build.gradle.kts build.gradle.kts.bak
            sed -i 's/ as String/ as? String ?: ""/g' build.gradle.kts
            echo "==== AFTER (35-55) ===="
            sed -n '35,55p' build.gradle.kts
          fi

      - name: Force JVM 17 for all subprojects
        working-directory: simple_live_app/android
        run: |
          if [ -f build.gradle.kts ]; then
            cat >> build.gradle.kts <<'EOF'

          subprojects {
              afterEvaluate {
                  tasks.withType<JavaCompile>().configureEach {
                      sourceCompatibility = JavaVersion.VERSION_17.toString()
                      targetCompatibility = JavaVersion.VERSION_17.toString()
                  }
              }
          }
          EOF
            echo "==== build.gradle.kts (tail) ===="
            tail -20 build.gradle.kts
          elif [ -f build.gradle ]; then
            cat >> build.gradle <<'EOF'

          subprojects {
              afterEvaluate { project ->
                  project.tasks.withType(JavaCompile).configureEach {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
              }
          }
          EOF
            echo "==== build.gradle (tail) ===="
            tail -20 build.gradle
          fi

      - name: Create debug keystore and key.properties
        working-directory: simple_live_app/android
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > key.properties <<EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=$PWD/debug.keystore
          EOF
          cat key.properties

      - name: Flutter pub get
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build release APK
        working-directory: simple_live_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-android-apk
          path: simple_live_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
